<div class=" added_field" style="display: none">
    <div class="mt-4" id="audio">
        <span class="fw-bold">[[audio#name]]</span>
        <p class="mt-2">[[audio]]</p>
    </div>
</div>
<div class="body-pres">
    <div id="presentation-container" style="background-color:[[Farbe]]!important;">
        <div class="controls">
            <button type="button" id="fullscreen-btn-pres">
                <i class="fa-solid fa-expand"></i>
            </button>
            <button type="button" id="prev-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button type="button" id="play-btn">
                <i class="fa-solid fa-play"></i>
            </button>
<button type="button" id="stop-btn" title="Stoppen und zur ersten Folie">
        <i class="fa-solid fa-stop"></i>
            <button type="button" id="next-btn">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button type="button" id="download-pdf">
                <i class="fa-solid fa-print"></i>
            </button>
  ##actionsmenu##
           </div>
<div style="text-align: center"><input
                type="range"
                id="slide-slider"
                class="form-range"
                min="0"
                step="1"
                value="0"
                style="width:600px;max-width: 75%"
            ></div>
    </div>
  <audio id="presentation-audio" loop></audio>
    <div style="display:none;" class="data-field-html">
        [[Textbereich]]
    </div>
<script>
/* ---------- ELEMENTE ---------- */
const presentationContainer = document.getElementById('presentation-container');
const dataFieldHtml = document.querySelector('.data-field-html');
const slides = [];
let currentSlideIndex = 0;
let slideNumber = 1;
let foundValidSlide = false;
const audioElement = document.getElementById('presentation-audio');
const audioContainer = document.getElementById('audio');
let audioAvailable = false;
const playBtn = document.getElementById('play-btn');
const slider = document.getElementById('slide-slider');
const autoplayDelay = Number('[[duration]]') * 1000 || 4000;
console.log('[[duration]]:', [[duration]]);
console.log('Autoplay Delay in ms:', autoplayDelay);
let autoplayTimeout = null;
let lastSlideTimestamp = null;
/* ---------- AUDIO LADEN ---------- */
if (audioContainer) {
    const audioLink = audioContainer.querySelector('a.data-field-link');
    if (audioLink && audioLink.href) {
        audioElement.src = audioLink.href;
        audioElement.volume = 0.4;
        audioAvailable = true;
        console.log('Audio geladen:', audioLink.href);
    }
}
/* ---------- H3 SLIDES GENERIEREN ---------- */
    slides.push([
        `<div class="title-slide" style="text-align:center;">`,
        `<div style="display: flex; flex-direction: column; align-items: center; gap: 10px;justify-content: center; margin-top: 10%;">
  <h1>[[Titel]]</h1>
</div>`,
        `</div>`
    ]);
function findAllH3Elements(element) {
    return Array.from(element.querySelectorAll('h3'));
}
function getOuterWrapper(element) {
    let wrapperClasses = [];
    let currentElement = element;
    while (currentElement && currentElement !== dataFieldHtml) {
        if (currentElement.className) {
            wrapperClasses.unshift(currentElement.outerHTML.split('>')[0] + '>');
        }
        currentElement = currentElement.parentElement;
    }
    return wrapperClasses;
}
function getClosingTags(wrapperClasses) {
    return wrapperClasses.map(wrapper => {
        const tag = wrapper.match(/<(\w+)/)[1];
        return `</${tag}>`;
    }).reverse();
}
function processContentBetweenH3s(startH3, nextH3) {
    const content = [];
    const wrapperClasses = getOuterWrapper(startH3);
    const closingTags = getClosingTags(wrapperClasses);
    content.push(...wrapperClasses);
    const numbering = "[[Nummerierung]]";
    content.push(
        numbering === "ja"
            ? `<h3>${slideNumber}. ${startH3.innerHTML}</h3>`
            : `<h3>${startH3.innerHTML}</h3>`
    );
    let currentElement = startH3.nextElementSibling;
    while (currentElement && currentElement !== nextH3) {
        if (!currentElement.querySelector('h3')) content.push(currentElement.outerHTML);
        currentElement = currentElement.nextElementSibling;
    }
    content.push(...closingTags);
    return content;
}
/* ---------- FOLIEN ERZEUGEN ---------- */
const allH3Elements = findAllH3Elements(dataFieldHtml);
allH3Elements.forEach((h3, index) => {
    if (!h3.textContent.trim()) return;
    const nextH3 = allH3Elements[index + 1];
    const slideContent = processContentBetweenH3s(h3, nextH3);
    if (slideContent.length) {
        slides.push(slideContent);
        slideNumber++;
        foundValidSlide = true;
    }
});
if (!foundValidSlide) {
    presentationContainer.innerHTML = '<h3>Keine gültigen Folien gefunden</h3>';
} else {
    slides.forEach(content => {
        const slideDiv = document.createElement('div');
        slideDiv.classList.add('pres-slide');
        slideDiv.style.display = 'none';
        slideDiv.innerHTML = content.join('');
        presentationContainer.appendChild(slideDiv);
    });
}
/* ---------- SLIDES & SLIDER ---------- */
const allSlides = document.querySelectorAll('.pres-slide');
slider.max = allSlides.length - 1;
/* ---------- SHOW SLIDE FUNKTION ---------- */
function showSlide(index) {
    allSlides.forEach((slide, i) => {
        slide.style.display = i === index ? 'block' : 'none';
    });
    currentSlideIndex = index;
    slider.value = index;
}
/* ---------- AUTOPLAY ---------- */
let isPlaying = false;         // läuft die Präsentation gerade?
let isPaused = false;          // wurde sie nur pausiert (nicht gestoppt)?
let pausedSlideIndex = 0;      // merkt sich die Folie bei Pause

function startAutoplay(fromBeginning = false) {
    if (isPlaying) return;

    isPlaying = true;
    playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';

    // Audio abspielen
    if (audioAvailable) {
        audioElement.play().catch(() => {});
    }

    // Wenn von Anfang gewünscht (z. B. nach Stop oder erster Start)
    if (fromBeginning) {
        showSlide(0);
        isPaused = false;
    } else if (isPaused) {
        // Fortsetzen an der pausierten Stelle
        showSlide(pausedSlideIndex);
        isPaused = false;
    }
    // sonst: bleibe auf aktueller Folie (sicherheitshalber)

    clearTimeout(autoplayTimeout);
    scheduleNextSlide();
}

function pauseAutoplay() {
    if (!isPlaying) return;

    isPlaying = false;
    isPaused = true;
    pausedSlideIndex = currentSlideIndex;  // merken, wo wir waren

    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';

    if (audioAvailable) {
        audioElement.pause();
    }

    clearTimeout(autoplayTimeout);
}

function stopAutoplay() {
    isPlaying = false;
    isPaused = false;  // wichtig: kein "Pause"-Zustand mehr

    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';

    if (audioAvailable) {
        audioElement.pause();
    }

    clearTimeout(autoplayTimeout);
}

function scheduleNextSlide() {
    if (!isPlaying) return;

    autoplayTimeout = setTimeout(() => {
        let next = currentSlideIndex < allSlides.length - 1 ? currentSlideIndex + 1 : 0;
        showSlide(next);
        clearTimeout(autoplayTimeout);
        scheduleNextSlide();
    }, autoplayDelay);
}

/* ---------- EVENTS ---------- */
document.getElementById('prev-btn').addEventListener('click', () => {
    stopAutoplay();  // manuelle Navigation = vollständiger Stop
    showSlide(currentSlideIndex > 0 ? currentSlideIndex - 1 : allSlides.length - 1);
});

document.getElementById('next-btn').addEventListener('click', () => {
    stopAutoplay();
    showSlide(currentSlideIndex < allSlides.length - 1 ? currentSlideIndex + 1 : 0);
});

slider.addEventListener('input', () => {
    stopAutoplay();
    showSlide(parseInt(slider.value));
});

document.getElementById('fullscreen-btn-pres').addEventListener('click', () => {
    presentationContainer.classList.toggle('fullscreen');
});

// Play/Pause-Button Logik
playBtn.addEventListener('click', () => {
    if (isPlaying) {
        pauseAutoplay();               // läuft → pausieren (bleibt auf aktueller Folie)
    } else {
        if (isPaused) {
            startAutoplay(false);      // war pausiert → fortsetzen
        } else {
            startAutoplay(true);       // war gestoppt → von Anfang starten
        }
    }
});

/* ---------- STOP BUTTON ---------- */
const stopBtn = document.getElementById('stop-btn');

function stopPresentation() {
    stopAutoplay();                    // wirklich alles stoppen
    if (audioAvailable) {
        audioElement.pause();
        audioElement.currentTime = 0;  // Audio zurücksetzen
    }
    showSlide(0);                      // Zur Titelfolie
    playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
}

stopBtn.addEventListener('click', stopPresentation);
/* ---------- PDF / PRINT ---------- */
document.getElementById('download-pdf').addEventListener('click', function () {
    stopAutoplay();
    const printWindow = window.open('', '', 'width=1200,height=800');
    printWindow.document.write(`
        <html>
        <head>
            <title>Präsentation</title>
            <style>
                body { font-family: Arial; color: #333; margin:20px; }
                .pres-slide { page-break-after: always; padding:40px; }
                .pres-slide:last-child { page-break-after: auto; }
                h3 { font-size:26px; margin-bottom:20px; }
                p { font-size:18px; line-height:1.5; }
                img { max-width:90%; max-height:70vh; display:block; margin:20px auto; }
            </style>
        </head>
        <body>
    `);
    slides.forEach(slide => {
        printWindow.document.write('<div class="slide">');
        printWindow.document.write(slide.join(''));
        printWindow.document.write('</div>');
    });
    printWindow.document.write('</body></html>');
    printWindow.document.close();
    printWindow.focus();
    setTimeout(()=>printWindow.print(), 500);
});
/* ---------- START ---------- */
showSlide(0);
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Hole den tatsächlichen Farbwert aus dem Platzhalter [[Farbe]]
        let backgroundColor = '[[Farbe]]'; // Beispiel-Platzhalter, der durch den tatsächlichen Wert ersetzt werden muss
        console.log('Hintergrundfarbe:', backgroundColor); // Ausgabe der Hintergrundfarbe in der Konsole
   
        function getContrastColor(hexColor) {
            // Entferne das '#' Zeichen, falls es vorhanden ist
            hexColor = hexColor.replace('#', '');
   
            // Hex-Werte in RGB umwandeln
            let r = parseInt(hexColor.substring(0, 2), 16);
            let g = parseInt(hexColor.substring(2, 4), 16);
            let b = parseInt(hexColor.substring(4, 6), 16);
   
            // Berechne die Luminanz
            let luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
   
            // Wenn die Luminanz kleiner als 128 ist, wähle weiße Schriftfarbe, ansonsten schwarze Schriftfarbe
            return luminance < 128 ? 'white' : 'black';
        }
   
        // Berechne die Textfarbe basierend auf der Hintergrundfarbe
        let textColor = getContrastColor(backgroundColor);
        console.log('Textfarbe:', textColor); // Ausgabe der berechneten Textfarbe in der Konsole
   
        // Dynamisch den Stil auf .pres-slide anwenden mit !important
        document.querySelectorAll('#presentation-container .pres-slide').forEach(slide => {
            slide.style.setProperty('color', textColor, 'important');
        });
    });
   
    </script>
</div>
